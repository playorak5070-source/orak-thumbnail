<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=3840,initial-scale=1">
  <title>선택 1 레퍼런스형</title>
  <style>
    @font-face{font-family:Gmarket;src:url('./fonts/GmarketSansBold.otf') format('opentype');font-weight:700}
    @font-face{font-family:Gmarket;src:url('./fonts/GmarketSansMedium.otf') format('opentype');font-weight:500}
    *{box-sizing:border-box}html,body{margin:0;width:3840px;height:2160px;overflow:hidden}
    body{font-family:Gmarket,sans-serif;font-weight:700;color:#fff;background:#071a33}
    .canvas{position:relative;width:3840px;height:2160px;overflow:hidden;background:radial-gradient(circle at 18% 12%,#173c62 0%,#071a33 42%,#041326 100%)}
    .accent{position:absolute;left:0;top:0;bottom:0;width:39px;background:#ffd54a}
    .copy{position:absolute;inset:0;z-index:3}
    .pill{position:absolute;left:195px;right:195px;top:168px;height:144px;border-radius:72px;padding:30px 72px;background:#173b61;color:#d7e7f5;font-size:75px;letter-spacing:-3px}
    .main{position:absolute;left:195px;top:405px;width:2050px}
    .line1{font-size:230px;line-height:1.1;letter-spacing:-12px;color:#ffd54a;white-space:nowrap}
    .line2{font-size:270px;line-height:1.13;letter-spacing:-15px;margin-top:32px;white-space:nowrap}
    .badge{display:inline-flex;align-items:center;height:282px;border-radius:60px;padding:0 102px;margin-top:88px;background:#d93b34;box-shadow:0 39px 84px #030b17a8;font-size:150px;letter-spacing:-9px}
    .footer{position:absolute;left:195px;bottom:168px;font-size:72px;color:#abc0d3;font-weight:500}
    .hero{position:absolute;z-index:2;left:2415px;right:195px;top:335px;display:grid;gap:72px}
    .card{height:480px;border:6px solid #38506a;border-radius:78px;padding:54px 70px;background:linear-gradient(135deg,#102945,#0a1f38);box-shadow:0 42px 96px #020b1680}
    .rule{height:6px;background:#39526c;margin:28px 0 30px}
    .card svg{display:block;width:100%;height:330px}
  </style>
</head>
<body>
  <div class="canvas">
    <div class="accent"></div>
    <section class="copy">
      <div class="pill">보유자용 · 급락 뒤 첫 주말</div>
      <main class="main"><div class="line1">주말이 더</div><div class="line2">불안하다</div><div class="badge">월요일 전 확인</div></main>
      <div class="footer">코스피 5% 급락 뒤 · 주말 점검</div>
    </section>
    <section class="hero">
      <div class="card"><svg viewBox="0 0 900 330"><path d="M80 70H820M80 250H820" stroke="#39526c" stroke-width="7"/><line x1="265" y1="35" x2="265" y2="285" stroke="#2379e8" stroke-width="22" stroke-linecap="round"/><rect x="205" y="90" width="120" height="135" rx="16" fill="#2379e8"/><path d="M540 55V260M455 185L540 270L625 185" fill="none" stroke="#2379e8" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="card"><svg viewBox="0 0 900 330"><path d="M80 70H820M80 250H820" stroke="#39526c" stroke-width="7"/><line x1="265" y1="55" x2="265" y2="300" stroke="#ef3d3a" stroke-width="22" stroke-linecap="round"/><rect x="205" y="125" width="120" height="120" rx="16" fill="#ef3d3a"/><path d="M540 275V70M455 145L540 60L625 145" fill="none" stroke="#ef3d3a" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </section>
  </div>
  <script>if(new URLSearchParams(location.search).get('base')==='1'){document.querySelector('.copy').style.display='none';document.querySelector('.hero').style.display='none'}</script>
</body></html>
