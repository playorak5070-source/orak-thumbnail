<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>DB하이텍·NHN 기준선 썸네일</title>
  <style>
    @font-face{font-family:Gmarket;src:url('./fonts/GmarketSansBold.otf') format('opentype');font-weight:700}
    @font-face{font-family:Gmarket;src:url('./fonts/GmarketSansMedium.otf') format('opentype');font-weight:500}
    *{box-sizing:border-box}
    html,body{margin:0;width:1280px;height:720px;overflow:hidden}
    body{font-family:Gmarket,sans-serif;font-weight:700;color:#fff;background:radial-gradient(circle at 18% 12%,#173c62 0%,#071a33 42%,#041326 100%)}
    .accent{position:absolute;left:0;top:0;bottom:0;width:13px;background:#ffd54a}
    .pill{position:absolute;left:65px;right:65px;top:56px;height:48px;border-radius:24px;padding:11px 24px;background:#173b61;color:#d7e7f5;font-size:25px;letter-spacing:-1px}
    .main{position:absolute;left:65px;top:135px;width:700px}
    .price{font-size:76px;line-height:1.12;letter-spacing:-4px;color:#ffd54a;white-space:nowrap}
    .question{font-size:88px;line-height:1.14;letter-spacing:-5px;margin-top:15px;white-space:nowrap}
    .verdict{display:inline-flex;align-items:center;height:94px;border-radius:20px;padding:0 34px;margin-top:38px;background:#d93b34;box-shadow:0 13px 28px #030b17a8;font-size:54px;letter-spacing:-3px}
    .date{position:absolute;left:65px;bottom:56px;font-size:24px;color:#abc0d3;font-weight:500}
    .cards{position:absolute;left:805px;right:65px;top:112px;display:grid;gap:24px}
    .card{height:196px;border:2px solid #38506a;border-radius:26px;padding:25px 29px 22px;background:linear-gradient(135deg,#102945,#0a1f38);box-shadow:0 14px 32px #020b1680}
    .card-head{display:flex;align-items:center;font-size:29px;line-height:1}
    .status{margin-left:auto;font-size:25px}
    .db{color:#ff8c7e}.nhn{color:#75b5ff}
    .rule{height:2px;background:#39526c;margin:19px 0 17px}
    .values{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;column-gap:7px}
    .label{font-size:20px;color:#9eb2c7;font-weight:500}
    .value{font-size:32px;margin-top:5px;white-space:nowrap}
    .arrow{font-size:31px;color:#7893ad;text-align:center}
    .gap{font-size:20px;font-weight:500;text-align:right;margin-top:7px}
  </style>
</head>
<body>
  <div class="accent"></div>
  <div class="pill">장마감 · 지난 기준선 점검</div>
  <main class="main">
    <div class="price">8만 원 · 6만6천 원</div>
    <div class="question">종가로 지켰나?</div>
    <div class="verdict">둘 다 선 아래</div>
  </main>
  <div class="date">2026.11.19 정규장 종가 기준</div>
  <section class="cards">
    <article class="card">
      <div class="card-head"><span>DB하이텍</span><span class="status db">선 아래</span></div>
      <div class="rule"></div>
      <div class="values">
        <div><div class="label">기준선</div><div class="value">80,000원</div></div>
        <div class="arrow">→</div>
        <div><div class="label">종가</div><div class="value">75,900원</div></div>
      </div>
      <div class="gap db">기준선보다 4,100원</div>
    </article>
    <article class="card">
      <div class="card-head"><span>NHN</span><span class="status nhn">선 아래</span></div>
      <div class="rule"></div>
      <div class="values">
        <div><div class="label">기준선</div><div class="value">66,000원</div></div>
        <div class="arrow">→</div>
        <div><div class="label">종가</div><div class="value">64,100원</div></div>
      </div>
      <div class="gap nhn">기준선보다 1,900원</div>
    </article>
  </section>
</body>
</html>
