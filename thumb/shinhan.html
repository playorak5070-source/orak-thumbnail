<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>신한지주 썸네일</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{ --navy:#06143a; --navy2:#0c2a6e; --yellow:#ffe500; --red:#e8141b; --white:#fff; }
html,body{margin:0;background:#000}
.t{position:relative;width:1280px;height:720px;overflow:hidden;
  background:radial-gradient(90% 100% at 22% 45%, var(--navy2) 0%, var(--navy) 75%);
  font-family:'PretendardBlack','Jalnan',sans-serif;}
.grid{position:absolute;top:0;left:0;width:800px;height:720px;opacity:.16;
  -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);
  background-image:linear-gradient(rgba(120,170,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.5) 1px,transparent 1px);
  background-size:64px 64px;}
.photo{position:absolute;top:0;right:0;width:520px;height:720px;object-fit:cover;object-position:60% 50%}
.fade{position:absolute;top:0;left:740px;width:220px;height:720px;
  background:linear-gradient(90deg,#06143a 0%,rgba(6,20,58,.9) 25%,rgba(6,20,58,.45) 60%,rgba(6,20,58,0) 100%)}
.copy{position:absolute;left:46px;top:34px;display:flex;flex-direction:column;gap:12px}
.line{white-space:nowrap;line-height:1.0;letter-spacing:-4px}
.o{ text-shadow:
  -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000, 6px 6px 0 #000,
  0 -7px 0 #000, 0 7px 0 #000, -7px 0 0 #000, 7px 0 0 #000,
  0 10px 18px rgba(0,0,0,.6);}
.l1{font-size:134px;color:var(--white)}
.l2{display:flex;align-items:baseline;gap:18px}
.l2 .day{font-size:98px;color:var(--white)}
.l2 .num{font-size:160px;color:var(--yellow);letter-spacing:-5px;
  text-shadow:-7px -7px 0 #000,7px -7px 0 #000,-7px 7px 0 #000,7px 7px 0 #000,0 -8px 0 #000,0 8px 0 #000,-8px 0 0 #000,8px 0 0 #000,
  0 0 36px rgba(255,40,20,.9),0 12px 22px rgba(0,0,0,.6)}
.l3{align-self:flex-start;padding:8px 24px 14px;background:var(--red);
  border:5px solid #000;border-radius:12px;transform:rotate(-1.5deg);box-shadow:0 10px 20px rgba(0,0,0,.5)}
.l3 span{font-size:94px;color:var(--white);
  text-shadow:-4px -4px 0 #7a0005,4px -4px 0 #7a0005,-4px 4px 0 #7a0005,4px 4px 0 #7a0005}
.l4{font-size:114px;color:var(--white);margin-top:2px}
.l4 b{font-weight:400;color:var(--yellow)}
.swoosh{position:absolute;left:0;bottom:24px;width:720px;height:12px;
  background:linear-gradient(90deg,var(--red) 0%,var(--red) 55%,rgba(232,20,27,0) 100%);transform:skewX(-30deg)}
</style>
</head>
<body>
<div class="t">
  <div class="grid"></div>
  <img class="photo" src="bg_right.jpg" alt="">
  <div class="fade"></div>
  <div class="copy">
    <div class="line l1 o">신한지주</div>
    <div class="line l2"><span class="day o">하루</span><span class="num">+5.65%</span></div>
    <div class="line l3"><span>코스피 빠진 날</span></div>
    <div class="line l4 o"><b>돈이</b> 몰린 이유</div>
  </div>
  <div class="swoosh"></div>
</div>
</body>
</html>
